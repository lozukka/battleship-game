<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>
  <body>
    <header>
      <h1>Battleship</h1>
    </header>
    <main>
      <div id="messagearea"></div>
      <div id="placement">
        <p>Place the following ship: <span id="current-ship"></span></p>
        <button id="direction">Toggle direction</button>
        <button id="randomize">Randomize</button>
        <button id="startgame" class="hide">Start Game</button>
      </div>
      <div id="gamearea">
        <div id="human-board-container">
          <h2>Your board</h2>
          <div id="human-board"></div>
        </div>
        <div id="computer-board-container" class="hide">
          <h2>Computer's board</h2>
          <div id="computer-board"></div>
        </div>
      </div>
    </main>
  </body>
</html>
